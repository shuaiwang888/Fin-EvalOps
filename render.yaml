# =============================================================================
# ⚠️  DEPRECATED — Render deployment has been migrated to Hugging Face Spaces.
#
# This file is kept as a historical record. The current deployment is on HF
# Spaces (Docker SDK), with HF Datasets as the persistence layer. See:
#   - DEPLOY_HF.md  (full deployment guide)
#   - README.md     (overview + local dev)
#
# To spin up a new Render instance from this file (not recommended), set the
# following environment variables in the Render Dashboard:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, DASHSCOPE_API_KEY, DEEPSEEK_API_KEY,
#   MINIMAX_API_KEY, IWENCAI_BASE_URL, CORS_ORIGINS
# Free tier caveat: SQLite at ./data/ is ephemeral (no persistent disk on
# free). Use a paid disk or a managed Postgres. Same issue HF had to solve
# with HF Datasets — HF just gives you a more ergonomic alternative.
# =============================================================================
services:
  - type: web
    name: fin-evalops-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    autoDeploy: true
    branch: main
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_JUDGE_MODEL
        value: claude-sonnet-4-6
      - key: IWENCAI_VERIFY_SSL
        value: "false"
      # Repo-relative paths (rootDir is backend, so go up one)
      - key: SKILLS_ROOT
        value: ../skills
      - key: TESTSETS_ROOT
        value: ../数据测试集
      # Ephemeral on free tier — auto-created by init_db() on boot
      - key: DB_PATH
        value: ./data/fin_evalops.db
      # ----- SECRETS — set manually in Render Dashboard -----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_BASE_URL
        value: https://api.minimaxi.com/anthropic
      - key: IWENCAI_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
